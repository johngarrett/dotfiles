set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
setw -g mode-keys vi

bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

setw -g mouse on

set-option -sg escape-time 10
set-option -g focus-events on

# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'

# status line theme
set -g @plugin 'o0th/tmux-nova'
set -g @nova-segments-0-right "whoami"
b_bg="#504945"

seg_a="#a89984 #282828"
seg_b="$b_bg #ddc7a1"

inactive_bg="#32302f"
inactive_fg="#ddc7a1"
active_bg=$b_bg
active_fg="#ddc7a1"

run '~/.tmux/plugins/tpm/tpm'

# Black status line with white text and a gray active pane border.
set -g status-style 'bg=#262626,fg=#ffffff'
setw -g window-status-style 'bg=#262626,fg=#ffffff'
setw -g window-status-current-style 'bg=#282828,fg=#ffffff,bold'
setw -g pane-border-style 'fg=#262626'
setw -g pane-active-border-style 'fg=#808080'

# swap C-b with C-a
unbind-key C-b
set-option -g prefix C-a
bind-key C-a send-prefix
