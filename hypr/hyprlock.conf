$font = BlexMono Nerd Font

general {
    hide_cursor = true
}

animations {
    enabled = true
    bezier = easeOut, 0.22, 1, 0.36, 1
    animation = fadeIn, 1, 4, easeOut
    animation = fadeOut, 1, 4, easeOut
}

background {
    monitor =
    color = rgb(1d1f21)
}

label {
    monitor =
    text = $TIME
    color = rgb(f5f5f5)
    font_size = 72
    font_family = $font
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:60000] date +"%A, %B %d"
    color = rgb(a1b0b8)
    font_size = 18
    font_family = $font
    position = 0, 35
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 360, 54
    outline_thickness = 0
    inner_color = rgb(252525)
    font_color = rgb(f5f5f5)
    fail_color = rgb(bd2c40)
    check_color = rgb(c3d82c)
    font_family = $font
    placeholder_text = Password
    fail_text = $PAMFAIL
    dots_spacing = 0.25
    rounding = 8
    position = 0, -55
    halign = center
    valign = center
}
