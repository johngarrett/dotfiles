general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # NVIDIA resume and the Studio Display's USB/Thunderbolt hub complete
    # asynchronously. Waiting here avoids racing the post-suspend modeset.
    after_sleep_cmd = sleep 2; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'
}
