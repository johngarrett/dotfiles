general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # NVIDIA resume and the Studio Display's USB/Thunderbolt hub complete
    # asynchronously. Wait for an output before the post-suspend modeset.
    after_sleep_cmd = if [ -x "$HOME/.local/bin/restore-display" ]; then "$HOME/.local/bin/restore-display"; elif [ -x "$HOME/dotfiles/bin/restore-display" ]; then "$HOME/dotfiles/bin/restore-display"; else sleep 4; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; fi
}

listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

listener {
    timeout = 300
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
    on-resume = if [ -x "$HOME/.local/bin/restore-display" ]; then "$HOME/.local/bin/restore-display"; elif [ -x "$HOME/dotfiles/bin/restore-display" ]; then "$HOME/dotfiles/bin/restore-display"; else sleep 4; hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; fi
}
